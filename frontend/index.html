<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El mismo planeta que va en la cabecera. El .ico primero porque lleva
         cada tamaño ya dibujado y a 16 px se ve nítido; el PNG de 64 lo usan
         los navegadores que lo prefieren. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#38bdf8" />
    <meta name="description" content="Transferencias internacionales en minutos" />
    <title>KSAGLOBAL EVOLUTION</title>

    <!-- Vista previa al compartir el enlace (WhatsApp, Telegram, Facebook).
         Sin estas etiquetas, WhatsApp cae al <title> y a la descripcion, que es
         por lo que el recuadro decia "Ksa Global".

         Las URLs van absolutas y con el dominio escrito: Open Graph lo exige
         —quien lee estas etiquetas es el servidor de WhatsApp, no el navegador,
         y una ruta relativa no le dice desde donde colgarla—. Es el unico sitio
         de la aplicacion donde el dominio se escribe a mano; si vuelve a
         cambiar, hay que tocarlo aqui. -->
    <meta property="og:site_name" content="KSAGLOBAL EVOLUTION" />
    <meta property="og:title" content="KSAGLOBAL EVOLUTION" />
    <meta property="og:description" content="Transferencias internacionales en minutos" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ksaglobal-evolution.com/" />
    <meta property="og:image" content="https://ksaglobal-evolution.com/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="es_ES" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KSAGLOBAL EVOLUTION" />
    <meta name="twitter:description" content="Transferencias internacionales en minutos" />
    <meta name="twitter:image" content="https://ksaglobal-evolution.com/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
