# /etc/nginx/sites-available/ppa-api
#
# Sustituir api.TUDOMINIO.com por tu subdominio real ANTES de instalar.
# Este server solo sirve la API. El frontend sigue en Vercel.
#
# certbot anade automaticamente el bloque SSL (443) y la redireccion desde 80
# al ejecutar:  certbot --nginx -d api.TUDOMINIO.com

upstream ppa_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.TUDOMINIO.com;

    # Comprobantes de pago / avatares. Subir si hace falta.
    client_max_body_size 15M;

    access_log /var/log/nginx/ppa-api.access.log;
    error_log  /var/log/nginx/ppa-api.error.log;

    # No revelar version de nginx
    server_tokens off;

    # --- WebSocket del chat (routers/chat.py -> /ws/chat/{order_id}) ---
    location /ws/ {
        proxy_pass http://ppa_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un chat abierto no debe morir por timeout de lectura.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Archivos subidos: los sirve nginx directo, no uvicorn ---
    # Mucho mas rapido y libera al unico worker de Python.
    location /uploads/ {
        alias /opt/ppa/backend/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";

        # Nada de ejecutar lo que suban los usuarios.
        location ~* \.(php|py|sh|cgi|pl)$ { deny all; }
    }

    # --- API ---
    location /api/ {
        proxy_pass http://ppa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://ppa_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # Documentacion de la API: abierta solo si la quieres publica.
    # Recomendado dejar comentado en produccion.
    # location ~ ^/(docs|redoc|openapi.json) {
    #     proxy_pass http://ppa_api;
    #     proxy_set_header Host $host;
    # }

    location / {
        return 404;
    }
}
