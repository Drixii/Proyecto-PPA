# /etc/nginx/sites-available/ppa-api
#
# Sirve TODO desde el droplet: la web (React compilado) y la API (FastAPI),
# bajo el mismo dominio. Al compartir origen no hace falta CORS ni configurar
# VITE_API_URL: el frontend llama a /api y nginx lo enruta al backend.
#
# Sustituir NOMBRE_DEL_SITIO por el dominio real antes de instalar.
# certbot añade el bloque SSL (443) y la redirección desde 80 al ejecutar:
#   certbot --nginx -d tudominio.com

upstream ppa_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name NOMBRE_DEL_SITIO;

    # Comprobantes de pago / avatares. Subir si hace falta.
    client_max_body_size 15M;

    access_log /var/log/nginx/ppa-api.access.log;
    error_log  /var/log/nginx/ppa-api.error.log;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- WebSocket del chat (routers/chat.py -> /ws/chat/{order_id}) ---
    location /ws/ {
        proxy_pass http://ppa_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un chat abierto no debe morir por timeout de lectura.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- API ---
    location /api/ {
        proxy_pass http://ppa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://ppa_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Archivos subidos: los sirve nginx directo, no uvicorn ---
    location /uploads/ {
        alias /opt/ppa/backend/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";

        # Nada de ejecutar lo que suban los usuarios.
        location ~* \.(php|py|sh|cgi|pl)$ { deny all; }
    }

    # --- Frontend: React compilado por Vite ---
    root /opt/ppa/frontend/dist;
    index index.html;

    # Los bundles llevan hash en el nombre, así que se pueden cachear para
    # siempre: si cambia el contenido, cambia el nombre del archivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # El service worker y el manifest NO se cachean: si se quedan pegados,
    # el navegador sigue sirviendo la versión vieja de la app tras un deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # React Router maneja las rutas en el cliente: cualquier URL desconocida
    # devuelve index.html en vez de un 404 del servidor.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
