# Encabezados de seguridad de la web. Se instala en
# /etc/nginx/snippets/ppa-seguridad.conf.
#
# Va en un archivo aparte porque nginx no hereda los add_header del bloque
# server en una location que tenga los suyos: cada location con su propio
# Cache-Control tiene que volver a incluir este archivo, o esas respuestas
# (la página principal entre ellas) salen sin ninguno de estos encabezados.

# Solo HTTPS durante un año. Sin includeSubDomains: no todos los subdominios
# de los dominios servidos aquí están garantizados con certificado.
add_header Strict-Transport-Security "max-age=31536000" always;

# El navegador no adivina tipos: un archivo subido no se ejecuta como script.
add_header X-Content-Type-Options "nosniff" always;

# Nadie puede meter la web en un iframe para engañar clics.
add_header X-Frame-Options "SAMEORIGIN" always;

# A otros sitios solo se les dice el dominio de origen, nunca la ruta.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permisos del navegador que la web no usa, apagados.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=()" always;

add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
